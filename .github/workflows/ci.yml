# This workflow will do an install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: Zarel/setup-node@patch-1
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm ci --prefix app --no-audit --no-fund
    - run: npm run test:releases
    - run: npm run test
      env:
        CI: true
    - run: npm --prefix app run build
    - name: Package Android-ready web update
      if: github.event_name == 'push'
      run: node scripts/web-release.mjs pack
    - uses: actions/upload-artifact@v4
      if: github.event_name == 'push'
      with:
        name: web-release-${{ github.run_attempt }}
        path: web-release/
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-pages-artifact@v3
      if: github.event_name == 'push'
      with:
        path: dist

  publish:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/configure-pages@v5
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
