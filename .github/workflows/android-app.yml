name: RnB Calc Android

on:
  push:
    paths:
      - app/**
      - src/**
      - patches/**
      - package.json
      - package-lock.json
      - webpack.config.js
      - build.cjs
      - offline-plugin.cjs
      - tsconfig.json
      - .github/workflows/android-app.yml
  pull_request:
    paths:
      - app/**
      - src/**
      - patches/**
      - package.json
      - package-lock.json
      - webpack.config.js
      - build.cjs
      - offline-plugin.cjs
      - tsconfig.json
      - .github/workflows/android-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install calculator and app dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix app --no-audit --no-fund
      - name: Build web UI and sync Android
        run: npm --prefix app run android:sync
      - name: Build, lint, and test Android
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rnb-calc-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnb-calc-android-reports
          path: |
            app/android/app/build/reports/
            app/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
