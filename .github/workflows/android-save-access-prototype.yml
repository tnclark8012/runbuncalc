name: Android save access PROTOTYPE

on:
  push:
    branches: [prototype/android-save-access]
    paths:
      - prototypes/android-save-access/**
      - .github/workflows/android-save-access-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and lint the debug APK
        run: gradle -p prototypes/android-save-access --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: save-access-prototype-debug
          path: prototypes/android-save-access/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
