<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run & Bun Calculator</title>
  <link rel="stylesheet" href="./css/theme-variables.css">
  <style>
    body {
      margin: 0;
    }
    .sandbox-app {
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }
    .sandbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .sandbox-header h1 {
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.2;
      margin: 0;
    }
    .sandbox-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .move-result-subgroup {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin: 1em 0;
      padding: 1em;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .set-selectors {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      max-width: 1200px;
      margin: 16px auto 0;
    }
    .set-selector-container {
      min-width: 0;
    }
    @media (max-width: 799px) {
      .sandbox-app {
        padding: 8px;
      }
      .set-selectors {
        gap: 8px;
      }
      .move-result-subgroup {
        padding: 4px;
      }
      .result-move-header {
        min-height: 40px;
      }
      .player-party-manager {
        flex-direction: column;
      }
      .player-party-manager > div:last-child {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="sandbox-root"></div>
  <script type="text/javascript" src="./sandbox.bundle.js?"></script>
</body>
</html>
